<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 50 Silent Killers of Trading | Wealthmaster</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #03050a;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 215, 0, 0.04), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 23, 68, 0.04), transparent 25%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        h1, h2, h3, .title-font { font-family: 'Outfit', sans-serif; }
        
        .progress-bar-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 4px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 2000;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FF1744);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .presentation {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slides-wrapper {
            position: relative;
            width: 95%;
            max-width: 1300px;
            height: 85vh;
            max-height: 800px;
            background: rgba(10, 14, 22, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* ===== PERSISTENT BRANDING ===== */
        .persistent-brand {
            position: absolute;
            top: 25px;
            left: 40px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .persistent-brand img { height: 40px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .persistent-brand .watermark-text { display: flex; flex-direction: column; line-height: 1.2; }
        .persistent-brand .watermark-name { font-family: 'Outfit'; font-weight: 700; color: #fff; font-size: 1.1rem; letter-spacing: 1px; opacity: 0.9; }
        .persistent-brand .watermark-location { font-family: 'Inter'; font-weight: 500; color: #94a3b8; font-size: 0.75rem; letter-spacing: 0.5px; }

        .persistent-website {
            position: absolute;
            bottom: 25px;
            right: 40px;
            z-index: 50;
            font-family: 'Outfit';
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1.5px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        #dynamicSlide {
            width: 100%;
            height: 100%;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        /* ===== SCROLL ANIMATIONS ===== */
        .slide-in-next { animation: slideNext 0.6s cubic-bezier(0.25, 1, 0.2, 1) forwards; }
        .slide-in-prev { animation: slidePrev 0.6s cubic-bezier(0.25, 1, 0.2, 1) forwards; }

        @keyframes slideNext { 0% { opacity: 0; transform: translateX(80px) scale(0.97); } 100% { opacity: 1; transform: translateX(0) scale(1); } }
        @keyframes slidePrev { 0% { opacity: 0; transform: translateX(-80px) scale(0.97); } 100% { opacity: 1; transform: translateX(0) scale(1); } }

        /* Typography & Layout */
        .slide-title { font-size: clamp(2.2rem, 3.5vw, 4rem); font-weight: 800; line-height: 1.1; margin-bottom: 20px; background: linear-gradient(135deg, #FFF 0%, #cbd5e1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-title { font-size: clamp(3rem, 5vw, 5.5rem); }
        .slide-desc { font-size: clamp(1.1rem, 1.4vw, 1.5rem); color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }
        
        .bg-number { position: absolute; top: -20px; right: 20px; font-size: 16rem; font-family: 'Outfit'; font-weight: 900; color: rgba(255, 255, 255, 0.025); z-index: 0; line-height: 1; pointer-events: none; }
        
        .slide-content { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; align-items: center; gap: 50px; }
        .text-section { flex: 1.2; display: flex; flex-direction: column; justify-content: center; }

        .highlight-box { background: rgba(255, 215, 0, 0.05); border-left: 4px solid #FFD700; padding: 18px 24px; border-radius: 0 12px 12px 0; font-size: 1.1rem; color: #FFD700; font-weight: 600; font-family: 'Outfit'; }

        /* ===== CUSTOM GRIDS FOR NEW SLIDES ===== */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; }
        .info-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 25px; border-radius: 20px; transition: 0.3s; }
        .info-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.05); border-color: rgba(255,215,0,0.3); }
        .info-card i { font-size: 2rem; color: #FFD700; margin-bottom: 15px; }
        .info-card h3 { font-family: 'Outfit'; font-size: 1.3rem; margin-bottom: 10px; color: #fff; }
        .info-card p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }

        .review-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; margin-top: 20px;}
        .review-card { background: linear-gradient(145deg, rgba(20,25,35,0.8), rgba(10,14,22,0.9)); border: 1px solid rgba(255,215,0,0.1); padding: 30px; border-radius: 20px; display: flex; flex-direction: column; }
        .stars { color: #FFD700; margin-bottom: 15px; font-size: 1.2rem; }
        .review-text { font-size: 1rem; color: #cbd5e1; font-style: italic; flex-grow: 1; margin-bottom: 20px; line-height: 1.6; }
        .reviewer-name { font-family: 'Outfit'; font-weight: 700; color: #fff; }
        .reviewer-role { font-size: 0.8rem; color: #00E676; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }

        /* Mentor Profile Specific */
        .mentor-profile-layout { display: flex; gap: 50px; align-items: center; height: 100%; z-index: 1; position: relative; }
        .mentor-image-large { flex: 0.8; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
        .mentor-image-large img { width: 350px; height: 350px; border-radius: 50%; object-fit: cover; border: 5px solid #FFD700; box-shadow: 0 0 50px rgba(255,215,0,0.2); position: relative; z-index: 2; }
        .mentor-image-large::after { content: ''; position: absolute; width: 400px; height: 400px; background: rgba(255,215,0,0.1); border-radius: 50%; filter: blur(50px); }

        /* Event Specific */
        .hero-layout { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; z-index: 1; }
        .academy-branding { display: flex; align-items: center; gap: 20px; margin-bottom: auto; }
        .academy-branding img { height: 95px; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.6)); }
        .academy-info { display: flex; flex-direction: column; gap: 4px; }
        .academy-name { font-family: 'Outfit'; font-size: 2.2rem; font-weight: 800; color: #FFD700; line-height: 1; letter-spacing: 1px; }
        .academy-location { font-family: 'Inter'; font-size: 1.1rem; font-weight: 500; color: #cbd5e1; letter-spacing: 1px; }
        
        .hero-main-content { display: flex; align-items: center; justify-content: space-between; margin-top: -20px; gap: 40px; }
        .hero-text { flex: 1.5; }
        
        .badge-premium { display: inline-block; padding: 6px 16px; background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3); color: #FFD700; border-radius: 30px; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }

        .event-details { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .detail-item { background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 12px; font-family: 'Outfit'; font-weight: 600; font-size: 1rem; color: #e2e8f0; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .detail-item i { color: #00E676; font-size: 1.2rem; }

        /* Graphics Engine */
        .visual-section { flex: 1; height: 100%; border-radius: 24px; background: linear-gradient(135deg, rgba(20,25,35,0.6), rgba(5,10,15,0.8)); border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; position: relative; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); overflow: hidden; }
        .graphic-orb { position: absolute; width: 250px; height: 250px; border-radius: 50%; filter: blur(50px); opacity: 0.3; }
        .orb-1 { top: -50px; left: -50px; }
        .orb-2 { bottom: -50px; right: -50px; }
        .graphic-icon { position: relative; z-index: 2; font-size: 7.5rem; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); animation: float 4s ease-in-out infinite; }
        .ring { position: absolute; border: 2px dashed rgba(255,255,255,0.1); border-radius: 50%; animation: spin 30s linear infinite; }
        .ring-1 { width: 280px; height: 280px; border-color: rgba(255, 215, 0, 0.1); }
        .ring-2 { width: 340px; height: 340px; animation-direction: reverse; border-style: dotted; }

        @keyframes float { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-10px) scale(1.02); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Navigation */
        .nav-btn { position: fixed; top: 50%; transform: translateY(-50%); width: 55px; height: 55px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 20px; cursor: pointer; z-index: 1000; transition: all 0.2s; }
        .nav-btn:hover { background: rgba(255,215,0,0.2); border-color: #FFD700; color: #FFD700; }
        .nav-btn.left { left: 20px; }
        .nav-btn.right { right: 20px; }

        .bottom-counter { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); font-family: 'Outfit'; font-size: 1.1rem; font-weight: 700; letter-spacing: 2px; color: #64748b; z-index: 1000; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 6px 18px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.05); transition: opacity 0.3s; }

        /* Animations */
        .anim-item { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; } .delay-3 { animation-delay: 0.3s; } .delay-4 { animation-delay: 0.4s; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (max-width: 900px) {
            .slide-content, .hero-main-content, .mentor-profile-layout { flex-direction: column-reverse; gap: 30px; text-align: center; }
            .hero-layout { align-items: center; }
            .academy-branding img { height: 70px; }
            .academy-name { font-size: 1.6rem; }
            .academy-branding { margin-bottom: 20px; }
            .event-details { justify-content: center; }
            .info-grid, .review-grid { grid-template-columns: 1fr; }
            #dynamicSlide { padding: 25px; overflow-y: auto;}
            
            .persistent-brand { top: 15px; left: 20px; }
            .persistent-brand img { height: 28px; }
            .persistent-brand .watermark-name { font-size: 0.9rem; }
            .persistent-brand .watermark-location { font-size: 0.6rem; }
            .persistent-website { bottom: 15px; right: 20px; font-size: 0.75rem; }

            .bg-number { display: none; }
            .nav-btn { width: 40px; height: 40px; font-size: 16px; }
            .nav-btn.left { left: 10px; }
            .nav-btn.right { right: 10px; }
            .visual-section { flex: 0.8; width: 100%; min-height: 180px; }
            .graphic-icon { font-size: 5rem; }
            .highlight-box { text-align: left; }
            .mentor-image-large img { width: 200px; height: 200px; margin-top: 20px; }
        }
    </style>
</head>
<body>

    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    
    <button class="nav-btn left" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
    <button class="nav-btn right" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
    
    <div class="bottom-counter" id="slideCounter">00 / 50</div>

    <div class="presentation">
        <div class="slides-wrapper">
            
            <!-- PERSISTENT WATERMARK BRANDING -->
            <div id="persistentBrand" class="persistent-brand">
                <img src="https://github.com/helpwareinstitute-hash/Thewaregroupweb/blob/main/wealthmaster%20logo.png?raw=true" alt="Wealthmaster Logo">
                <div class="watermark-text">
                    <span class="watermark-name">Wealthmaster Academy</span>
                    <span class="watermark-location">New Sanghvi, Pune</span>
                </div>
            </div>
            <div id="persistentWebsite" class="persistent-website">
                www.wealthmasteracademy.in
            </div>

            <!-- DYNAMIC SLIDE CONTENT -->
            <div id="dynamicSlide"></div>

        </div>
    </div>

    <script>
        // Full 50-Point Database
        const painPoints = [
            { title: "No Setup, But Still Trading", desc: "The market is dead, but 'doing nothing' feels uncomfortable, so you invent a trade. No setup equals a random entry, which guarantees a random result.", insight: "Waiting is a highly active and profitable trading decision.", visual: "fa-eye-slash", color1: "#FF1744", color2: "#FFA500" },
            { title: "Overtrading", desc: "One trade becomes five. Five become fifteen. You are no longer analyzing the market—you are purely trading your emotions.", insight: "Brokerage eats your capital. Overtrading eats your psychology.", visual: "fa-chart-line", color1: "#FFD700", color2: "#FF1744" },
            { title: "FOMO (Fear of Missing Out)", desc: "The price starts flying. You panic and jump in because 'I will miss the move.' A late entry instantly turns a good trend into a terrible risk-to-reward trade.", insight: "Chasing green candles is the fastest way to see red P&L.", visual: "fa-fire-alt", color1: "#00E676", color2: "#FFD700" },
            { title: "Early Entry (Prediction)", desc: "'I know the market will go up here.' You enter before the structure actually confirms it. The market does not care what you think you know.", insight: "Trade what you see, not what you predict.", visual: "fa-brain", color1: "#00BFFF", color2: "#FF1744" },
            { title: "Stop-Loss Hit Repeatedly", desc: "Entry → SL Hit → Re-entry → SL Hit again. Often, the problem isn't your stop-loss placement, but entering without proper structural confirmation.", insight: "Stop entering in the middle of a choppy range.", visual: "fa-magnet", color1: "#FF1744", color2: "#94a3b8" },
            { title: "SL Hit... Then Targets Met", desc: "The most painful experience. A wick takes out your SL and then flies to your target. This tricks you into believing the market is 'hunting' you.", insight: "Your SL was placed exactly where everyone else placed theirs.", visual: "fa-magnet", color1: "#FFD700", color2: "#FF1744" },
            { title: "Zero Patience", desc: "A professional setup takes hours to form, but you want instant action. Impatient traders manufacture fake opportunities.", insight: "The market pays you to wait, not to click.", visual: "fa-hourglass-half", color1: "#00E676", color2: "#00BFFF" },
            { title: "Revenge Trading", desc: "Loss → Anger → Bigger Position → Bigger Loss. Your next trade becomes a desperate attempt to punish the market and recover your money.", insight: "The market doesn't know you exist. Stop fighting it.", visual: "fa-fire-alt", color1: "#FF1744", color2: "#000" },
            { title: "Increasing Lot Size After a Loss", desc: "'I will recover the entire loss in one big trade.' This exact mindset turns a manageable 2% loss into a devastating 50% account blowout.", insight: "Never increase risk when your mind is compromised.", visual: "fa-balance-scale", color1: "#FF1744", color2: "#FFA500" },
            { title: "Zero-to-Hero Mindset", desc: "'I will turn ₹10,000 into ₹1 Lakh this week.' Trading becomes a lottery ticket rather than a scalable, skill-based business process.", insight: "Focus on percentages, not absolute numbers.", visual: "fa-dice", color1: "#FFD700", color2: "#00E676" },
            { title: "Searching for the Magic Strategy", desc: "New indicator today. New Telegram setup tomorrow. You abandon strategies before giving them a sufficient statistical sample size to prove their edge.", insight: "The Holy Grail is risk management, not an indicator.", visual: "fa-eye-slash", color1: "#00BFFF", color2: "#FFD700" },
            { title: "The '100% Formula' Illusion", desc: "You are constantly searching for a formula that guarantees 90% accuracy. It does not exist. Trading is entirely about probabilities and risk control.", insight: "A 40% win rate is highly profitable with a 1:3 Risk/Reward.", visual: "fa-bullseye", color1: "#FFD700", color2: "#FF1744" },
            { title: "Random Trading", desc: "No clear technical reason for entry, no defined Stop Loss, no target in mind, and no position-sizing plan. Pure chaos.", insight: "Random inputs will only ever generate random outputs.", visual: "fa-dice", color1: "#94a3b8", color2: "#FF1744" },
            { title: "No Trading Plan", desc: "You enter the trade first in a panic, and only then do you decide where to place your SL and target. Professional execution is the exact opposite.", insight: "Define the exit before you ever make the entry.", visual: "fa-book-open", color1: "#00BFFF", color2: "#00E676" },
            { title: "No Risk Management", desc: "You focus entirely on 'How much money can I make?' instead of 'How much will I lose?' Profit is uncertain; risk is entirely in your control.", insight: "Survive first. Thrive second.", visual: "fa-balance-scale", color1: "#FFD700", color2: "#FF1744" },
            { title: "Trading Scared Capital", desc: "When every trade is connected to rent, EMI, or survival, emotional pressure is at its peak. You will inevitably make fear-based decisions.", insight: "Money needed for survival should never touch a trading account.", visual: "fa-balance-scale", color1: "#FF1744", color2: "#94a3b8" },
            { title: "The 'Daily Expense' Mindset", desc: "Entering the market solely to earn today's grocery or fuel money. The market does not owe you a daily salary.", insight: "The market moves on its own schedule, not yours.", visual: "fa-bullseye", color1: "#00E676", color2: "#FFD700" },
            { title: "Daily Target Obsession", desc: "'I must make ₹2,000 every single day.' When the market is choppy and provides no setups, this target forces you into terrible trades.", insight: "Some days your job is simply not to lose money.", visual: "fa-bullseye", color1: "#FFD700", color2: "#FF1744" },
            { title: "The Screenshot Trap", desc: "Someone posts a ₹50,000 profit screenshot, and suddenly your process feels useless. You see their reward, but not their capital, losses, or risk.", insight: "Social media shows the highlight reel, not the reality.", visual: "fa-mobile-alt", color1: "#00BFFF", color2: "#00E676" },
            { title: "Toxic Comparison", desc: "'Why is he making money and I am failing?' Comparison creates immense internal pressure, and pressure guarantees poor execution.", insight: "Your only competition is your own trading journal.", visual: "fa-mobile-alt", color1: "#FF1744", color2: "#FFA500" },
            { title: "Loss of Self-Belief", desc: "After a series of losses, you completely stop trusting your own analysis. You start relying on tips from strangers instead of fixing your process.", insight: "Confidence comes from strict risk management.", visual: "fa-brain", color1: "#94a3b8", color2: "#FF1744" },
            { title: "Strategy Hopping", desc: "Loss from Strategy A → Switch to Strategy B → Switch to Indicator C. You blame the tool instead of correcting your psychology.", insight: "Master one setup perfectly before learning another.", visual: "fa-eye-slash", color1: "#FFA500", color2: "#00BFFF" },
            { title: "Signal Dependency", desc: "'Where should I buy? Where is the SL?' Outsourcing your decisions ensures you will never develop the skill of independent trading.", insight: "A tip can give you a trade, but only skill gives you a career.", visual: "fa-mobile-alt", color1: "#FFD700", color2: "#00BFFF" },
            { title: "Analysis Paralysis", desc: "Too many indicators, too many opinions, too many timeframes. More information does not create better decisions; it creates confusion.", insight: "Keep your charts clean and your rules simple.", visual: "fa-brain", color1: "#FF1744", color2: "#00BFFF" },
            { title: "Predicting Every Move", desc: "You want to know exactly where NIFTY will go today. Trading is about managing probabilities and reacting to price, not playing fortune teller.", insight: "You don't need to know what happens next to make money.", visual: "fa-brain", color1: "#00E676", color2: "#FFD700" },
            { title: "Entering Because 'It's Cheap'", desc: "'It has fallen so much, it has to go up now.' Cheap is not a setup. Price can remain weak far longer than your account can remain solvent.", insight: "Never catch a falling knife.", visual: "fa-chart-line", color1: "#FF1744", color2: "#94a3b8" },
            { title: "Chasing Fast Markets", desc: "A massive candle prints, and you hit buy at the absolute peak. Excitement has completely replaced technical analysis.", insight: "If you missed the entry, let it go. There is always another trade.", visual: "fa-fire-alt", color1: "#00E676", color2: "#FFD700" },
            { title: "Adding to a Losing Trade", desc: "'Let me average my buy price; the market will reverse.' Without a plan, averaging turns a minor mistake into a fatal portfolio wound.", insight: "Add to your winners, never to your losers.", visual: "fa-balance-scale", color1: "#FF1744", color2: "#FFA500" },
            { title: "Frustration After Consecutive Losses", desc: "Three losses create the feeling: 'The market is just bad today.' You then start forcing terrible trades just to close the day in the green.", insight: "Set a daily loss limit. If it hits, close the terminal.", visual: "fa-brain", color1: "#FF1744", color2: "#94a3b8" },
            { title: "Exiting Winners Too Early", desc: "A small profit appears, and you panic-sell immediately. Then you watch helplessly as the market hits your massive original target.", insight: "Let your probabilities play out.", visual: "fa-hourglass-half", color1: "#00E676", color2: "#FFD700" },
            { title: "Holding Losers Too Long", desc: "Small loss → Hope → Bigger loss → 'I will wait a little longer.' You give a losing position more time than you give a winning one.", insight: "Hope is the most expensive emotion in trading.", visual: "fa-hourglass-half", color1: "#FF1744", color2: "#FFA500" },
            { title: "Reverse Risk-to-Reward", desc: "You book profits in seconds, but you let losses run for hours. This behavior mathematically guarantees long-term failure.", insight: "Cut losses fast. Hold winners long.", visual: "fa-balance-scale", color1: "#00E676", color2: "#FF1744" },
            { title: "Trading All Day Long", desc: "Market opens → Trade → Lunch → Trade → Expiry → Trade. Sitting in front of the screen all day long drains your mental capital.", insight: "Most of your profit will come from just 1-2 hours of the day.", visual: "fa-hourglass-half", color1: "#00BFFF", color2: "#94a3b8" },
            { title: "Ignoring Market Context", desc: "You see a bullish candlestick but completely ignore the overriding downtrend, structural resistance, and low volume.", insight: "Context is king. A pattern is useless without it.", visual: "fa-eye-slash", color1: "#FFD700", color2: "#FF1744" },
            { title: "Using Every Indicator Available", desc: "RSI + MACD + VWAP + Supertrend + Fibonacci. When everything on your screen is flashing signals, nothing is actually a clear signal.", insight: "Remove the noise to see the price.", visual: "fa-chart-line", color1: "#00BFFF", color2: "#00E676" },
            { title: "Wanting Instant Results", desc: "You join a course on Monday and expect a consistent professional income by Friday. Trading requires months of screen time to master.", insight: "Treat it like a degree, not a get-rich-quick scheme.", visual: "fa-hourglass-half", color1: "#FFD700", color2: "#FFA500" },
            { title: "Pure Profit Obsession", desc: "You study the target levels for hours, but spend only five seconds calculating risk. Professional trading starts with defending capital.", insight: "If you control the downside, the upside takes care of itself.", visual: "fa-balance-scale", color1: "#00E676", color2: "#FFD700" },

            if (e.key === 'ArrowRight' && currentSlide < totalSlides - 1) renderSlide(currentSlide + 1, 'next');
